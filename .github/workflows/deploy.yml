name: Deploy OCI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: both
        type: choice
        options:
          - both
          - frontend
          - backend

concurrency:
  group: oci-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend VM
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'frontend')
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    steps:
      - name: Checkout code on runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload client to FE VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_FE_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_FE_SSH_PRIVATE_KEY }}
          source: "client"
          target: "since_ai_deploy"
          overwrite: true
          rm: true

      - name: Build and run client container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_FE_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_FE_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Host nginx: allow dashboard uploads (default client_max_body_size is 1 MB -> HTML 413).
            # Applied on every deploy; rolled back automatically if nginx rejects the config.
            if command -v nginx >/dev/null 2>&1; then
              conf=/etc/nginx/conf.d/zerofault-uploads.conf
              if printf 'client_max_body_size 250m;\nproxy_read_timeout 300s;\nproxy_send_timeout 300s;\n' \
                   | sudo -n tee "$conf" >/dev/null && sudo -n nginx -t; then
                sudo -n systemctl reload nginx && echo "nginx: uploads up to 250 MB allowed"
              else
                echo "WARNING: could not apply $conf (no passwordless sudo, or nginx rejected it); upload limit unchanged"
                sudo -n rm -f "$conf" || true
                sudo -n nginx -t >/dev/null 2>&1 && sudo -n systemctl reload nginx || true
              fi
            fi

            cd ~/since_ai_deploy/client
            # Host nginx owns :80/:443 and proxies to this container on :8080
            # (same-origin /api → backend). Leave API base empty for relative /api calls.
            docker build \
              --build-arg "VITE_API_BASE_URL=" \
              -t since-ai-client:latest .
            docker rm -f since-ai-client || true
            docker run -d \
              --name since-ai-client \
              --restart unless-stopped \
              -p 127.0.0.1:8080:80 \
              since-ai-client:latest
            docker image prune -f

            # nginx needs a moment after `docker run`; a single immediate curl gets "connection reset" (exit 56)
            echo "Waiting for client container..."
            ok=0
            for i in $(seq 1 30); do
              if curl -sf --max-time 2 -o /dev/null http://127.0.0.1:8080/; then
                echo "Client OK"
                ok=1
                break
              fi
              echo "attempt $i/30 failed; container status:"
              docker ps -a --filter name=since-ai-client --format '{{.Status}}' || true
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Client health check failed. Logs:"
              docker logs since-ai-client --tail 100 || true
              exit 1
            fi
            curl -sf -o /dev/null http://127.0.0.1/ || true

  deploy-backend:
    name: Deploy backend VM
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'backend')
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    steps:
      - name: Checkout code on runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload server to BE VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_BE_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_BE_SSH_PRIVATE_KEY }}
          source: "server,retrofit_engine,.dockerignore"
          target: "since_ai_deploy"
          overwrite: true
          rm: true

      - name: Build and run server container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_BE_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_BE_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Host nginx (only if this VM runs one): allow dashboard uploads, same as the frontend job.
            if command -v nginx >/dev/null 2>&1; then
              conf=/etc/nginx/conf.d/zerofault-uploads.conf
              if printf 'client_max_body_size 250m;\nproxy_read_timeout 300s;\nproxy_send_timeout 300s;\n' \
                   | sudo -n tee "$conf" >/dev/null && sudo -n nginx -t; then
                sudo -n systemctl reload nginx && echo "nginx: uploads up to 250 MB allowed"
              else
                echo "WARNING: could not apply $conf (no passwordless sudo, or nginx rejected it); upload limit unchanged"
                sudo -n rm -f "$conf" || true
                sudo -n nginx -t >/dev/null 2>&1 && sudo -n systemctl reload nginx || true
              fi
            fi

            cd ~/since_ai_deploy
            docker build -f server/Dockerfile -t since-ai-server:latest .
            docker rm -f since-ai-server || true
            docker run -d \
              --name since-ai-server \
              --restart unless-stopped \
              -p 8000:8000 \
              -e "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
              -e "MONGODB_URI=${{ secrets.MONGODB_URI }}" \
              since-ai-server:latest
            docker image prune -f

            echo "Waiting for API health..."
            ok=0
            for i in $(seq 1 30); do
              if curl -sf --max-time 2 http://127.0.0.1:8000/health; then
                echo
                echo "Health OK"
                ok=1
                break
              fi
              echo "attempt $i/30 failed; container status:"
              docker ps -a --filter name=since-ai-server --format '{{.Status}}' || true
              sleep 2
            done

            if [ "$ok" -ne 1 ]; then
              echo "Health check failed. Logs:"
              docker logs since-ai-server --tail 100 || true
              exit 1
            fi
