# RETROFIT AI 2026 - public fleet configuration (training + validation assets).
# All sites, vessels and assets are fictional. Ratings are chosen to be internally consistent
# (hydraulic power / efficiency / motor rating) and inside the ranges documented in docs/TECHNICAL_MODEL.md.
# Test-split assets are defined in the organizer package only.

dataset_version: "1.0.0"
public_seed: 20261106

profiles:
  SHIP_SW_COOLING:           # open seawater circuit: sea chest -> strainer -> pump -> central cooler (plate HX) -> overboard
    salinity_psu: 6.0
    control: VFD_TEMPERATURE
    voltage_v: 440
    supply_hz: 60
    h0_shutoff_ratio: 1.22
    system_static_m: 3.0     # overboard discharge above waterline
    suction_loss_m_at_design: 0.9
    strainer_share: 0.65
    valve_share_of_K: 0.15
    valve_design_position: 0.9
    design_supply_temp_c: 25.0   # Baltic-trade design sea temperature (assumption); full design flow at full load
    controlled_temp_setpoint_c: 36.0
    min_flow_frac: 0.40
    r_min: 0.50
    r_max: 1.0
    speed_tau_s: 25.0
    startup_ramp_s: 12.0
    coastdown_tau_s: 7.0
    roll_period_s: 11.0
    vfd_efficiency: 0.97
    rated_slip: 0.012
    inrush_multiple: 6.5
    bearing_rise_k: 24.0
    bearing_tau_s: 1500.0
    winding_rise_k: 70.0
    winding_tau_s: 2400.0
    const_loss_share: 0.35
    level_measured: false
    wireless_update_s: 300
    context:
      sea_leg_h: 10.5
      manoeuvre_h: 0.6
      port_h: 1.4
      demand_sea: 0.88
      demand_manoeuvre: 0.62
      demand_port: 0.38
      engine_room_c: 36.0
      sea_chest_submergence_m: 4.8
      standby_prob: 0.5
      storm_prob: 0.5
      startup_s: 12
      shutdown_s: 15
  SHIP_LT_FRESHWATER:         # closed low-temperature fresh-water loop (central cooler -> engine/aux consumers), expansion-tank pressurised
    salinity_psu: 0.0
    control: FIXED_SPEED
    voltage_v: 440
    supply_hz: 60
    h0_shutoff_ratio: 1.20
    system_static_m: 0.0
    loop_pressurisation_kpa: 120.0
    suction_loss_m_at_design: 0.6
    strainer_share: 0.5
    valve_share_of_K: 0.20
    valve_design_position: 0.85
    loop_temp_c: 34.0
    startup_ramp_s: 4.0
    coastdown_tau_s: 8.0
    rated_slip: 0.013
    inrush_multiple: 6.8
    bearing_rise_k: 22.0
    bearing_tau_s: 1500.0
    winding_rise_k: 72.0
    winding_tau_s: 2400.0
    const_loss_share: 0.35
    level_measured: false
    wireless_update_s: 300
    context:
      sea_leg_h: 10.5
      manoeuvre_h: 0.6
      port_h: 1.4
      demand_sea: 0.9
      demand_manoeuvre: 0.65
      demand_port: 0.4
      engine_room_c: 36.0
      sea_chest_submergence_m: 4.8
      standby_prob: 0.4
      storm_prob: 0.4
      startup_s: 6
      shutdown_s: 12
  INDUSTRIAL_CW:              # cooling-tower basin -> pump -> process heat exchangers -> tower distribution
    salinity_psu: 0.0
    control: VFD_PRESSURE
    voltage_v: 400
    supply_hz: 50
    h0_shutoff_ratio: 1.20
    system_static_m: 7.0
    suction_loss_m_at_design: 0.7
    strainer_share: 0.6
    valve_share_of_K: 0.30
    valve_design_position: 0.75
    r_min: 0.55
    r_max: 1.0
    speed_tau_s: 15.0
    startup_ramp_s: 10.0
    coastdown_tau_s: 8.0
    vfd_efficiency: 0.97
    rated_slip: 0.015
    inrush_multiple: 6.5
    bearing_rise_k: 24.0
    bearing_tau_s: 1500.0
    winding_rise_k: 72.0
    winding_tau_s: 2400.0
    const_loss_share: 0.35
    level_measured: true
    wireless_update_s: 300
    context:
      shift_hours: [6, 22]
      demand_shift: 0.9
      demand_night: 0.55
      demand_weekend: 0.45
      hall_c: 22.0
      suction_static_m: 2.5
      stop_prob: 0.5
      startup_s: 10
      shutdown_s: 10
  PROCESS_TRANSFER:           # smaller hot-process-water transfer pump, batch cycles, flow-control valve
    salinity_psu: 0.0
    control: FLOW_VALVE
    voltage_v: 400
    supply_hz: 50
    h0_shutoff_ratio: 1.18
    system_static_m: 8.0
    suction_loss_m_at_design: 0.5
    strainer_share: 0.7
    valve_share_of_K: 0.35
    valve_design_position: 0.7
    valve_tau_s: 6.0
    startup_ramp_s: 3.0
    coastdown_tau_s: 4.0
    rated_slip: 0.025
    inrush_multiple: 7.0
    bearing_rise_k: 26.0
    bearing_tau_s: 1100.0
    winding_rise_k: 75.0
    winding_tau_s: 1500.0
    const_loss_share: 0.35
    level_measured: true
    wireless_update_s: 300
    context:
      run_h: [1.0, 4.0]
      idle_h: [0.2, 1.5]
      setpoints: [0.6, 0.75, 0.9, 1.0]
      process_temp_c: 62.0
      hall_c: 26.0
      suction_static_m: 2.2
      startup_s: 4
      shutdown_s: 6

# ------------------------------------------------------------------------------------------------------
# Assets. Scenario entries: type, onset_h (hours from window start; negative = pre-existing), end_h (repair or
# resolution; omit = persists), repair_h (locked-out maintenance stop after end_h), params (latent-process
# parameters, see docs/TECHNICAL_MODEL.md section 5), sensor_tag (instrument faults), root_cause (index of the
# causing scenario entry, 1-based, for compound incidents). Onsets receive seeded jitter.
# ------------------------------------------------------------------------------------------------------
