server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: React app talks to the BE via VITE_API_BASE_URL (browser → BE public IP).
    # Do not proxy to a Docker hostname "server" — that only exists in docker-compose.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
