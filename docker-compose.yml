services:
  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build:
      context: ./client
      args:
        # Empty base → browser calls same origin; nginx proxies /api and /health
        VITE_API_BASE_URL: ""
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
